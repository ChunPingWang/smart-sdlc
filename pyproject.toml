[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-pipeline"
version = "0.1.0"
description = "Document-to-Code Pipeline - AI-driven document processing and specification generation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Rex Wang" }
]
keywords = ["ai", "document-processing", "specification", "llm", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Document parsing (simplified for compatibility)
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pdfplumber>=0.11.0",
    "python-magic>=0.4.27",

    # Text processing and chunking
    "tiktoken>=0.8.0",

    # LLM integration (OpenAI + Anthropic)
    "openai>=1.0.0",
    "anthropic>=0.40.0",

    # Utilities
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
doc-pipeline = "doc_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
